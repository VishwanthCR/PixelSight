[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urban_satellite_super_resolution"
version = "0.1.0"
description = "Uncertainty-aware urban analysis from Sentinel-2 imagery"
requires-python = ">=3.11"
dependencies = [
	"numpy>=1.24",
	"pandas>=2.0",
	"PyYAML>=6",
	"torch>=2.0",
	"fastapi>=0.115,<1",
	"python-multipart>=0.0.20,<1",
	"uvicorn[standard]>=0.34,<1",
	"rasterio>=1.3,<2",
	"Pillow>=10,<13",
	"scipy>=1.10",
	"scikit-image>=0.21",
	"matplotlib>=3.7",
]

[project.scripts]
urban-sr = "urban_satellite_super_resolution.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pixelsight*", "urban_satellite_super_resolution*", "backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks live integration tests that require Copernicus network credentials",
]