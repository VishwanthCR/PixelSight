name: pixelsight
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.12
  - numpy=2.2.2
  - scipy=1.15.1
  - scikit-image=0.26.0
  - matplotlib=3.11.2
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - rasterio
  - boto3
  - requests
  - pillow
  - pip
  - pip:
      - torch==2.14.0
      - torchvision==0.29.0
      - omegaconf
      - opensr-model
      - opensr-utils
